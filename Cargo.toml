[workspace]
members = [
    "crates/nanite-cli",
    "crates/nanite-core",
    "crates/nanite-git",
    "crates/nanite-plugins",
]
exclude = ["plugins"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.98"
version = "0.1.11"

[workspace.metadata.release]
shared-version = true
tag-name = "v{{version}}"

[workspace.dependencies]
anyhow = "=1.0.104"
assert_cmd = "=2.2.2"
camino = { version = "=1.2.5", features = ["serde1"] }
clap = { version = "=4.6.6", features = ["derive", "wrap_help"] }
clap_complete = "=4.6.9"
crossterm = "=0.29.0"
predicates = "=3.1.4"
ratatui = "=0.30.2"
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
time = { version = "=0.3.55", features = ["formatting", "macros", "parsing", "serde"] }
toml = "=1.1.4"
url = "=2.5.8"
walkdir = "=2.5.0"
which = "=8.0.6"

[workspace.lints.rust]
unsafe_code = "forbid"
unnameable_types = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
