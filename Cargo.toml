[workspace]
members = [
    "crates/nanite-cli",
    "crates/nanite-core",
    "crates/nanite-git",
    "crates/nanite-agents",
    "crates/nanite-plugins",
]
exclude = ["plugins"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.95"
version = "0.1.10"

[workspace.metadata.release]
shared-version = true
tag-name = "v{{version}}"

[workspace.dependencies]
anyhow = "=1.0.102"
arborium = { version = "=2.17.0", features = ["all-languages"] }
assert_cmd = "=2.2.2"
camino = { version = "=1.2.2", features = ["serde1"] }
clap = { version = "=4.6.1", features = ["derive", "wrap_help"] }
clap_complete = "=4.6.5"
crossterm = "=0.29.0"
ignore = "=0.4.25"
predicates = "=3.1.4"
ratatui = "=0.30.0"
rayon = "=1.12.0"
regex = "=1.12.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
serde_yaml = "=0.9.34"
tantivy = "=0.26.1"
tera = "=1.20.1"
tempfile = "=3.27.0"
time = { version = "=0.3.47", features = ["formatting", "macros", "parsing", "serde"] }
tiny_http = "=0.12.0"
toml = "=1.1.2"
url = "=2.5.8"
walkdir = "=2.5.0"
which = "=8.0.2"

[workspace.lints.rust]
unsafe_code = "forbid"
unnameable_types = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
