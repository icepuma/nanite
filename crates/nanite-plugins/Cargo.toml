[package]
name = "nanite-plugins"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
nanite-core = { path = "../nanite-core" }
nanite-git = { path = "../nanite-git" }
# Pulled in transitively by `wasmtime-wasi-http/default-send-request`,
# but rustls 0.23 requires a process-wide `CryptoProvider` to be picked
# explicitly. We pick `aws-lc-rs` (already in the tree) and install it
# via a `OnceLock` at the top of `PluginRuntime::new`.
rustls = { version = "=0.23.43", default-features = false, features = ["aws_lc_rs"] }
serde.workspace = true
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["rt", "macros"] }
# wasmtime + the Cranelift compiler for component compilation. The
# `anyhow` feature adds `From<wasmtime::Error> for anyhow::Error` so
# host code can use `?` against our `anyhow::Result` API.
#
# Pulley (the interpreter, smaller binary, slower execution) was
# evaluated in the plan but currently still requires a code generator
# for wasm→pulley translation, so dropping Cranelift entirely isn't
# yet practical. Revisit when Pulley supports standalone compilation.
wasmtime = { version = "=48.0.1", default-features = false, features = [
    "component-model",
    "runtime",
    "cranelift",
    "anyhow",
    "std",
] }
wasmtime-wasi = { version = "=48.0.1", default-features = false, features = ["p2"] }
wasmtime-wasi-http = { version = "=48.0.1", default-features = false, features = [
    "default-send-request",
    "p2",
] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
