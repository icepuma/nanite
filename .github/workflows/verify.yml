name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run Dagger checks
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "1.0.0-beta.26"
          verb: check
          # content/plugins/*.wasm is gitignored, so skip the "generated files
          # are up to date" checks; the checks build the plugins themselves.
          args: --generated=false
